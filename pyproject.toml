[project]
name = "peakrdl-cocotb-ralgen"
dynamic = ["version"]
description = "Generate RAL tests from systemRDL."
authors = [
    {name = "Vijayvithal Jahagirdar", email = "jahagirdar.vs@gmail.com"},
]
# Updated to Python 3.12
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "systemrdl-compiler>=1.27.3",
    "jinja2>=3.1.4",
    "peakrdl>=1.1.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project.entry-points."peakrdl.exporters"]
cocotb_ralgen = "peakrdl_cocotb_ralgen.__peakrdl__:Exporter"

[project.scripts]
cocotb_ralgen = "peakrdl_cocotb_ralgen.cli:cocotb_ralgenerator"

[project.urls]
Homepage = "https://dyumnin.com/cocotb_ralgen"
Repository = "https://github.com/dyumnin/cocotb-ralgen.git"
Issues = "https://github.com/dyumnin/cocotb-ralgen/issues"
Documentation = "https://dyumnin.github.io/cocotb-ralgen"

[tool.pdm]
distribution = true

[tool.pdm.version]
source = "scm"

[tool.pdm.dev-dependencies]
# Consolidated dev-dependencies for modern PDM usage
maintain = [
    "black>=24.0", # Bumped for 3.12 stability
    "blacken-docs>=1.16",
    "git-changelog>=2.3",
    "duty>=0.10",
]
quality = [
    "ruff>=0.1.0",
    "mypy>=1.7",
    "types-markdown>=3.5",
    "types-pyyaml>=6.0",
    "safety>=2.3",
]

[dependency-groups]
tests = [
    "pytest>=8.0", # Pytest 8+ is smoother with 3.12
    "pytest-cov>=4.1",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.3",
    "cocotb>=2.0.1",
    "cocotbext-axi>=0.1.26",
    "cocotbext-dyulib>=0.0.4",
]
docs = [
    "markdown-callouts>=0.3",
    "markdown-exec>=1.7",
    "mkdocs>=1.5",
    "mkdocs-coverage>=1.0",
    "mkdocs-gen-files>=0.5",
    "mkdocs-git-committers-plugin-2>=1.2",
    "mkdocs-literate-nav>=0.6",
    "mkdocs-material>=9.4",
    "mkdocs-minify-plugin>=0.7",
    "mkdocstrings[python]>=0.23",
    # Removed tomli as python 3.12 has tomllib builtin
]
